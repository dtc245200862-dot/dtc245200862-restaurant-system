events {
    worker_connections 1024;
}

http {
    # Hardening: Ẩn phiên bản Nginx
    server_tokens off;

    # Rate limiting chống DoS
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    upstream restaurant_web {
        server web:5000;
    }

    upstream pgadmin_service {
        server pgadmin:80;
    }

    # Chuyển hướng HTTP -> HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Cấu hình HTTPS an toàn
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Hardening: Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:;" always;

        # Web App Quản lý Nhà hàng
        location / {
            limit_req zone=one burst=20 nodelay;
            proxy_pass http://restaurant_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # pgAdmin quản trị database
        location /pgadmin/ {
            proxy_pass http://pgadmin_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}

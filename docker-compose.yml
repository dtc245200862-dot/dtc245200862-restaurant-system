version: '3.8'

# Phân chia mạng (Hardening: Network Isolation)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  loki_data:

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: StrongPass#2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Web Quản lý Nhà hàng / Order
  web:
    build: ./app
    container_name: restaurant-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: restaurant_db
      DB_USER: restaurant_user
      DB_PASSWORD: StrongPass#2026
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    # Hardening: giới hạn quyền container
    cap_drop:
      - ALL

  # 3. Nginx Reverse Proxy & SSL
  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - pgadmin
    networks:
      - frontend-net

  # 4. pgAdmin Quản trị PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurant-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dtc245200862@ictu.edu.vn
      PGADMIN_DEFAULT_PASSWORD: StrongPass#2026
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - frontend-net
      - backend-net

  # 5. Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring-net

  # 6. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: restaurant-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=StrongPass#2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-net

  # 7. cAdvisor Container Metrics
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: restaurant-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  # 8. Node Exporter Host Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: restaurant-node-exporter
    restart: unless-stopped
    networks:
      - monitoring-net

  # 9. Loki Log Server
  loki:
    image: grafana/loki:latest
    container_name: restaurant-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring-net

  # 10. Promtail Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: restaurant-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring-net
